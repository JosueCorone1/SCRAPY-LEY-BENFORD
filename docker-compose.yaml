services:
  instagram-scraper:
    build: .
    stdin_open: true
    tty: true
    volumes:
      - ./output:/app/output
      - ./.auth:/app/.auth
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-latest}
      - INSTAGRAM_COOKIES=${INSTAGRAM_COOKIES:-}
      - PLAYWRIGHT_HEADLESS=true
      - INSTAGRAM_REQUEST_INTERVAL_SECONDS=${INSTAGRAM_REQUEST_INTERVAL_SECONDS:-2}
      - INSTAGRAM_RATE_LIMIT_COOLDOWN_SECONDS=${INSTAGRAM_RATE_LIMIT_COOLDOWN_SECONDS:-900}
